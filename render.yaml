services:
  - type: web
    name: script-generator
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - src/**
        - server.js
        - vite.config.js
        - index.html
      ignoredPaths:
        - .claude/**
        - docs/**